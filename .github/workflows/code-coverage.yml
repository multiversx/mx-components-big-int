name: Code-coverage

on:
  push:
    branches: [ master, rc/*, feat/* ]
  pull_request:
    branches: [ master, feat/*, rc/* ]
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
        id: go

      - name: Check out code
        uses: actions/checkout@v6

      - name: Get dependencies
        run: |
          go get -v -t -d ./...

      - name: Run unit tests
        run: go test -short -cover -coverprofile=coverage.txt -covermode=atomic -v ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
